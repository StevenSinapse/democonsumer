services:
  kafka1:
    image: docker.io/apache/kafka:4.2.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: n1UFHa1UTXSvBOuUEJIyoQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      #KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - kafka-net

  kafka2:
    image: docker.io/apache/kafka:4.2.0
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9093:19092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_CLUSTER_ID: n1UFHa1UTXSvBOuUEJIyoQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      #KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - kafka-net

  kafka3:
    image: docker.io/apache/kafka:4.2.0
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9094:19092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_CLUSTER_ID: n1UFHa1UTXSvBOuUEJIyoQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      #KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - kafka-net
      
  duckdb:
    image: python:3.12-slim
    container_name: duckdb
    hostname: duckdb
    networks:
      - kafka-net
    volumes:
      - ./duckdb-data:/data
      - ./scripts:/scripts
    working_dir: /data
    command: >
      bash -c "
        pip install duckdb==1.3.1 confluent-kafka --quiet &&
        apt-get update -qq && apt-get install -y unzip curl --quiet &&
        curl -L https://github.com/duckdb/duckdb/releases/download/v1.3.1/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip &&
        unzip /tmp/duckdb.zip -d /usr/local/bin &&
        chmod +x /usr/local/bin/duckdb &&
        rm /tmp/duckdb.zip &&
        tail -f /dev/null
      "
    depends_on:
      - kafka1
      - kafka2
      - kafka3
   
  akhq:
    image: tchiotludo/akhq
    container_name: akhq
    hostname: akhq
    ports:
      - "9095:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: "kafka1:9092,kafka2:9092,kafka3:9092"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-net

  traefik:
    image: traefik:v3.3
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/conf"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - C:/Users/StevenNGUYEN/Documents/POC/PocKafka/factory/.docker/traefik-conf:/etc/traefik/conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ─── Base de données ──────────────────────────────────────────────────────────
  factory-db:
    image: postgres:17-alpine
    container_name: factory-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
    ports:
      - "${POSTGRES_PORT:-50763}:5432"
    volumes:
      - postgres_factory_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kafka-net

networks:
  kafka-net:
  
volumes:
  postgres_factory_data:
