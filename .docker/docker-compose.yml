# =============================================================================
# Cluster Kafka KRaft 3 brokers + Debezium Connect + PostgreSQL + DuckDB + AKHQ
# =============================================================================
# Corrections appliquées :
#   1. EXTERNAL listener port aligné avec le mapping ports: (19092 → hôte 9092/9093/9094)
#   2. Healthchecks ajoutés sur les brokers Kafka
#   3. restart: unless-stopped sur brokers et kafka-connect
#   4. KAFKA_LOG_DIRS déplacé sur volume persistant
#   5. DuckDB : image custom via build (Dockerfile inline via profiles ou à créer séparément)
#   6. KAFKA_AUTO_CREATE_TOPICS_ENABLE explicitement commenté (à activer selon besoin)
# =============================================================================

services:

  # ─── Brokers Kafka (KRaft mode) ────────────────────────────────────────────

  kafka1:
    image: docker.io/apache/kafka:4.2.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:19092"   # EXTERNAL : client hôte → broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: n1UFHa1UTXSvBOuUEJIyoQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka1:9092,
        EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"   # mettre "false" en prod
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-net

  kafka2:
    image: docker.io/apache/kafka:4.2.0
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9093:19092"   # EXTERNAL : client hôte → broker
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_CLUSTER_ID: n1UFHa1UTXSvBOuUEJIyoQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka2:9092,
        EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-net

  kafka3:
    image: docker.io/apache/kafka:4.2.0
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9094:19092"   # EXTERNAL : client hôte → broker
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_CLUSTER_ID: n1UFHa1UTXSvBOuUEJIyoQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka3:9092,
        EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - kafka-net

  # ─── AKHQ (UI Kafka) ───────────────────────────────────────────────────────

  akhq:
    image: tchiotludo/akhq
    container_name: akhq
    hostname: akhq
    ports:
      - "9095:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: "kafka1:9092,kafka2:9092,kafka3:9092"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kafka-net

  # ─── Base de données PostgreSQL ────────────────────────────────────────────

  factory-db:
    image: postgres:17-alpine
    container_name: factory-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_INITDB_ARGS: "--wal-level=logical"
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=4
      -c max_wal_senders=4
    ports:
      - "${POSTGRES_PORT:-50763}:5432"
    volumes:
      - postgres_factory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kafka-net

  # ─── Kafka Connect / Debezium ─────────────────────────────────────────────

  kafka-connect:
    image: quay.io/debezium/connect:3.1
    container_name: kafka-connect
    hostname: kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      GROUP_ID: "debezium-connect-cluster"
      CONFIG_STORAGE_TOPIC: "connect-configs"
      OFFSET_STORAGE_TOPIC: "connect-offsets"
      STATUS_STORAGE_TOPIC: "connect-statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      STATUS_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      factory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks:
      - kafka-net

  # ─── DuckDB ───────────────────────────────────────────────────────────────
  # ⚠️  Pour éviter la réinstallation à chaque démarrage, créer un Dockerfile
  #     dédié (voir duckdb/Dockerfile ci-dessous) et remplacer image: par build:
  #
  #  build:
  #    context: ./duckdb
  #    dockerfile: Dockerfile
  #
  # Contenu du Dockerfile suggéré :
  # ─────────────────────────────────────────────────────
  #   FROM python:3.12-slim
  #   RUN pip install duckdb==1.3.1 confluent-kafka \
  #    && apt-get update -qq \
  #    && apt-get install -y unzip curl --no-install-recommends \
  #    && curl -L https://github.com/duckdb/duckdb/releases/download/v1.3.1/duckdb_cli-linux-amd64.zip \
  #            -o /tmp/duckdb.zip \
  #    && unzip /tmp/duckdb.zip -d /usr/local/bin \
  #    && chmod +x /usr/local/bin/duckdb \
  #    && rm /tmp/duckdb.zip \
  #    && apt-get clean && rm -rf /var/lib/apt/lists/*
  #   WORKDIR /data
  #   CMD ["tail", "-f", "/dev/null"]
  # ─────────────────────────────────────────────────────


# ─── Réseaux ──────────────────────────────────────────────────────────────────

networks:
  kafka-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────

volumes:
  postgres_factory_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  duckdb_pip_cache:    # cache pip DuckDB (workaround avant migration vers Dockerfile)